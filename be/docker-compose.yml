services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mcpserver}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mcpserver-postgres:/var/lib/postgresql/data
  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-change-me}@postgres:5432/${DB_NAME:-mcpserver}
    depends_on:
      - postgres
    ports:
      - "${PORT:-3091}:3091"

volumes:
  mcpserver-postgres:
